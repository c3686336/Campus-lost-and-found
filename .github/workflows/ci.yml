name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, load, and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            # The dependency-free initial main revision has no lockfile.
            npm install --no-package-lock
          fi

      - name: Run regression tests
        run: npm test

      - name: Run isolated demo load test
        run: npm run test:load

      - name: Install pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/campus-playwright" --no-save --package-lock=false playwright@1.65.1
          "$RUNNER_TEMP/campus-playwright/node_modules/.bin/playwright" install --with-deps --only-shell chromium

      - name: Run Chromium browser scenarios
        run: npm run test:browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/campus-playwright/node_modules/playwright/index.mjs

      - name: Upload browser screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: browser-results
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
